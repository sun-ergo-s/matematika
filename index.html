<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Matematika</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6c5ce7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Násobilka">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff8ec;
    --card: #ffffff;
    --ink: #2d2a32;
    --muted: #7a7385;
    --primary: #6c5ce7;
    --primary-dark: #4b3cc4;
    --ok: #20b26b;
    --ok-soft: #d8f5e6;
    --bad: #ef5b5b;
    --bad-soft: #fde2e2;
    --warn: #f5a623;
    --warn-soft: #fff0d1;
    --grey-soft: #ece9f1;
    --dot-a: #ff8a5c;
    --dot-b: #6c5ce7;
    --radius: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Nunito", "Segoe UI", system-ui, sans-serif;
    font-weight: 600;
    user-select: none;
  }
  #app { max-width: 560px; margin: 0 auto; padding: 16px; min-height: 100%; display: flex; flex-direction: column; }
  .screen { display: flex; flex-direction: column; gap: 16px; flex: 1; }
  .hidden { display: none !important; }

  h1 { font-size: 34px; font-weight: 900; margin: 8px 0 0; text-align: center; color: var(--primary-dark); }
  .sub { text-align: center; color: var(--muted); margin: 0; font-size: 18px; }

  .card { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: 0 6px 0 rgba(0,0,0,.06); }
  .card h2 { margin: 0 0 12px; font-size: 20px; font-weight: 800; }

  button { font-family: inherit; cursor: pointer; border: none; }
  .big-btn {
    font-size: 24px; font-weight: 900; padding: 18px; border-radius: var(--radius);
    background: var(--primary); color: #fff; box-shadow: 0 6px 0 var(--primary-dark);
    transition: transform .08s;
  }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--primary-dark); }
  .big-btn.secondary { background: #fff; color: var(--primary-dark); box-shadow: 0 6px 0 #d9d3ef; }

  .reset-btn {
    align-self: center; margin-top: 4px; padding: 10px 18px; border-radius: 14px;
    font-size: 16px; font-weight: 800; background: var(--bad); color: #fff; box-shadow: 0 4px 0 #b42d2d;
  }
  .reset-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b42d2d; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(45, 42, 50, .45);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10;
    animation: fade .15s;
  }
  .modal {
    background: var(--card); border-radius: var(--radius); padding: 24px 20px 20px;
    max-width: 380px; width: 100%; text-align: center; box-shadow: 0 10px 0 rgba(0,0,0,.12);
    animation: pop .25s;
  }
  .modal-icon { font-size: 52px; line-height: 1; }
  .modal h2 { margin: 10px 0 6px; font-size: 24px; font-weight: 900; }
  .modal p { margin: 0 0 20px; color: var(--muted); font-size: 17px; }
  .modal-actions { display: flex; flex-direction: column; gap: 12px; }
  .modal-actions .big-btn { font-size: 20px; padding: 14px; }
  .big-btn.danger { background: var(--bad); box-shadow: 0 6px 0 #b42d2d; }
  .big-btn.danger:active { box-shadow: 0 2px 0 #b42d2d; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }

  /* --- menu --- */
  .section-label { font-size: 16px; font-weight: 800; color: var(--muted); margin: 6px 4px -6px; }
  .topic {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: var(--card); color: var(--ink); border-radius: var(--radius); padding: 16px;
    box-shadow: 0 6px 0 rgba(0,0,0,.06); transition: transform .08s;
  }
  .topic:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.06); }
  .topic-icon { font-size: 40px; line-height: 1; width: 52px; text-align: center; flex-shrink: 0; }
  .topic-body { flex: 1; min-width: 0; }
  .topic-name { font-size: 22px; font-weight: 900; color: var(--primary-dark); }
  .topic-desc { font-size: 15px; color: var(--muted); margin: 2px 0 8px; }
  .topic-bar { height: 10px; background: var(--grey-soft); border-radius: 6px; overflow: hidden; }
  .topic-bar > div { height: 100%; background: var(--ok); border-radius: 6px; }
  .topic-count { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .back-btn {
    align-self: flex-start; background: #fff; color: var(--primary-dark); border-radius: 14px;
    font-size: 17px; font-weight: 800; padding: 10px 16px; box-shadow: 0 4px 0 #e6e0d4;
  }
  .back-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #e6e0d4; }

  .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 10px; }
  .mode {
    position: relative;
    padding: 14px 6px; border-radius: 16px; font-size: 18px; font-weight: 800;
    background: var(--grey-soft); color: var(--ink); line-height: 1.2;
  }
  .mode .sym { display: block; font-size: 30px; font-weight: 900; }
  .mode.active { background: var(--primary); color: #fff; }
  .mode.done::after {
    content: "✓"; position: absolute; top: -6px; right: -4px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--ok); color: #fff; font-size: 15px; line-height: 24px; font-weight: 900;
  }

  .grid-label { font-size: 15px; color: var(--muted); margin: 10px 0 6px; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px; }
  .fact {
    font-size: 14px; font-weight: 800; padding: 5px 8px; border-radius: 10px;
    background: var(--grey-soft); color: var(--muted);
  }
  .fact.learning { background: var(--warn-soft); color: #9a6200; }
  .fact.weak { background: var(--bad-soft); color: #b42d2d; }
  .fact.mastered { background: var(--ok-soft); color: #137a48; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 13px; color: var(--muted); margin-top: 12px; }
  .legend span:not(.l-hint)::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 4px; vertical-align: -1px; }
  .legend .l-new::before { background: var(--grey-soft); }
  .legend .l-learning::before { background: var(--warn-soft); border: 1px solid #f5c26b; }
  .legend .l-weak::before { background: var(--bad-soft); border: 1px solid #f19a9a; }
  .legend .l-mastered::before { background: var(--ok-soft); border: 1px solid #7fd8ab; }

  /* --- hra --- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .icon-btn { background: #fff; border-radius: 14px; font-size: 22px; width: 48px; height: 48px; box-shadow: 0 4px 0 #e6e0d4; }
  .progress { flex: 1; height: 16px; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: inset 0 2px 0 rgba(0,0,0,.05); }
  .progress > div { height: 100%; width: 0; background: var(--primary); border-radius: 10px; transition: width .3s; }
  .stars { font-size: 20px; font-weight: 900; min-width: 64px; text-align: right; }

  .problem-card { text-align: center; padding: 24px 12px; }
  .counter { color: var(--muted); font-size: 16px; margin-bottom: 6px; }
  .prompt { font-size: 20px; font-weight: 800; color: var(--muted); margin-bottom: 8px; }
  .pic { display: flex; justify-content: center; margin-bottom: 10px; }
  .problem { font-size: 56px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .formula { font-size: 26px; font-weight: 900; margin-bottom: 4px; }
  .problem.mid { font-size: 40px; gap: 10px; }
  .problem.seq { font-size: 32px; gap: 10px; }
  .problem.mid .answer, .problem.seq .answer { min-width: 76px; height: 62px; }
  .d { color: var(--dot-b); }
  .j { color: var(--dot-a); }

  /* tyčinky (desiatky) a kocky (jednotky) */
  .blocks { --cell: 12px; display: flex; gap: 16px; align-items: flex-end; justify-content: center; flex-wrap: wrap; }
  .pic .blocks { --cell: 10px; }
  .rods { display: flex; gap: 6px; align-items: flex-end; }
  .rod-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .rod-lbl { font-size: 12px; font-weight: 800; color: var(--dot-b); }
  .rod {
    width: calc(var(--cell) + 3px); height: calc(var(--cell) * 10); border-radius: 3px; background-color: var(--dot-b);
    background-image: repeating-linear-gradient(to bottom, transparent 0 calc(var(--cell) - 1px), rgba(255,255,255,.6) calc(var(--cell) - 1px) var(--cell));
  }
  .cubes-wrap { display: flex; gap: 10px; align-items: flex-end; }
  .cubes { display: grid; grid-template-columns: repeat(5, calc(var(--cell) - 1px)); gap: 3px; }
  .cube { width: calc(var(--cell) - 1px); height: calc(var(--cell) - 1px); border-radius: 2px; background: var(--dot-a); }
  .ten-frame { border: 2px dashed var(--warn); border-radius: 8px; padding: 5px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .ten-cap { font-size: 12px; font-weight: 800; color: #9a6200; }

  /* číselný rad v pomôcke */
  .seq-row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px; }
  .seq-num { background: #f4f1fb; padding: 6px 10px; border-radius: 10px; font-size: 22px; font-weight: 900; }
  .seq-num.blank { background: var(--warn-soft); color: #9a6200; }
  .seq-jump { font-size: 15px; font-weight: 900; color: #9a6200; }
  .answer {
    min-width: 110px; height: 80px; padding: 0 14px; border-radius: 18px;
    border: 4px dashed #cfc7e8; display: inline-flex; align-items: center; justify-content: center;
    color: var(--primary-dark); background: #faf8ff;
  }
  .answer.empty::after { content: "?"; color: #cfc7e8; }
  .answer.ok { border: 4px solid var(--ok); background: var(--ok-soft); color: #137a48; }
  .answer.bad { border: 4px solid var(--bad); background: var(--bad-soft); color: #b42d2d; }
  .answer.reveal { border: 4px solid var(--warn); background: var(--warn-soft); color: #9a6200; }
  .shake { animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-10px)} 40%,80%{transform:translateX(10px)} }
  .pop { animation: pop .35s; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

  .feedback { min-height: 32px; margin-top: 12px; font-size: 22px; font-weight: 800; }
  .feedback.ok { color: var(--ok); }
  .feedback.bad { color: var(--bad); }
  .feedback.reveal { color: #9a6200; }

  .hint-btn { margin-top: 6px; background: var(--warn-soft); color: #9a6200; font-size: 17px; font-weight: 800; padding: 8px 16px; border-radius: 14px; }
  .hint { margin-top: 14px; }
  .hint-text { font-size: 18px; margin-bottom: 10px; }
  .groups { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .group { display: flex; flex-wrap: wrap; gap: 4px; padding: 7px; border-radius: 12px; background: #f4f1fb; max-width: 120px; justify-content: center; }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--dot-b); }
  .group:nth-child(even) .dot { background: var(--dot-a); }
  /* v zadaní sú skupiny stĺpčeky vedľa seba, aby sa zmestili do jedného riadku */
  .pic .groups { flex-wrap: nowrap; gap: 10px; }
  .pic .group { flex-direction: column; flex-wrap: nowrap; padding: 6px; }
  .pic .dot { width: 12px; height: 12px; }

  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: auto; }
  .key {
    font-size: 32px; font-weight: 900; height: 68px; border-radius: 18px;
    background: #fff; color: var(--ink); box-shadow: 0 5px 0 #e6e0d4; transition: transform .06s;
  }
  .key:active, .key.pressed { transform: translateY(4px); box-shadow: 0 1px 0 #e6e0d4; }
  .key.del { background: var(--bad-soft); color: #b42d2d; box-shadow: 0 5px 0 #f3bcbc; }
  .key.go { background: var(--ok); color: #fff; box-shadow: 0 5px 0 #138a50; }
  .key.go.next { background: var(--primary); box-shadow: 0 5px 0 var(--primary-dark); font-size: 26px; }
  /* porovnávanie: namiesto číslic znaky < = > */
  .key.sym { display: none; font-size: 40px; color: var(--primary-dark); }
  .keypad.cmp .key.num { display: none; }
  .keypad.cmp .key.sym { display: block; }
  .keypad.cmp .key.go { grid-column: 3; }

  /* teória */
  .theory { background: var(--warn-soft); }
  .theory h2 { color: #9a6200; }
  .theory p { margin: 0 0 10px; font-size: 17px; }
  .theory .formula { font-size: 26px; font-weight: 900; text-align: center; margin: 8px 0; }
  .theory .rule { font-weight: 900; font-size: 18px; color: var(--primary-dark); }
  .theory .groups { margin: 8px 0; }
  .pair { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; font-size: 26px; font-weight: 900; }
  .names { display: flex; justify-content: center; gap: 18px; font-size: 14px; color: var(--muted); margin-top: -4px; }
  .loose { display: grid; gap: 4px; padding: 7px; border-radius: 12px; background: #f4f1fb; }
  .pic .pair { gap: 8px; flex-wrap: nowrap; }
  .pic .group:empty { width: 26px; height: 26px; }
  .pic .groups:has(.group:empty) { gap: 6px; }
  .group:empty { width: 36px; height: 36px; border: 2px dashed #d9d3ef; background: none; }

  /* --- koniec --- */
  .end-stars { font-size: 46px; text-align: center; letter-spacing: 2px; line-height: 1.3; overflow-wrap: anywhere; }
  .end-score { text-align: center; font-size: 26px; font-weight: 900; }
  .mistakes { display: flex; flex-wrap: wrap; gap: 8px; }
  .mistake { background: var(--warn-soft); color: #9a6200; padding: 6px 10px; border-radius: 12px; font-weight: 800; font-size: 18px; }

  @media (max-width: 380px) {
    .problem { font-size: 48px; }
    .answer { min-width: 90px; }
    .problem.mid { font-size: 34px; }
    .problem.seq { font-size: 28px; }
  }
  @media (max-height: 820px) {
    .key { height: 58px; }
    .problem-card { padding: 16px 12px; }
    .feedback { margin-top: 8px; }
  }
  @media (max-height: 700px) {
    .problem { font-size: 44px; }
    .problem.mid { font-size: 36px; }
    .problem.seq { font-size: 28px; }
    .answer { height: 64px; min-width: 90px; }
    .key { height: 56px; font-size: 28px; }
    .problem-card { padding: 16px 10px; }
  }
</style>
</head>
<body>
<main id="app">

  <!-- MENU -->
  <section id="menu" class="screen">
    <h1>Matematika</h1>
    <p class="sub">pre 3. ročník</p>
    <div id="topicList" class="screen"></div>
    <button class="reset-btn" id="resetBtn">🗑️ Vymazať pamäť</button>
  </section>

  <!-- TÉMA -->
  <section id="home" class="screen hidden">
    <button class="back-btn" id="menuBtn">◀ Všetky cvičenia</button>
    <h1 id="topicTitle"></h1>
    <p class="sub" id="topicSub"></p>

    <div class="card">
      <h2>Čo budeme cvičiť?</h2>
      <div class="modes" id="modes"></div>
    </div>

    <div class="card theory hidden" id="theoryCard">
      <h2>📘 Zapamätaj si!</h2>
      <div id="theory"></div>
    </div>

    <button class="big-btn" id="startBtn">Začať ▶</button>

    <div class="card">
      <h2>Čo už vieš</h2>
      <div id="factGroups"></div>
      <div class="legend">
        <span class="l-new">ešte nebolo</span>
        <span class="l-learning">učím sa</span>
        <span class="l-weak">treba zopakovať</span>
        <span class="l-mastered">viem to!</span>
        <span class="l-hint">💡 s pomôckou</span>
      </div>
    </div>
  </section>

  <!-- HRA -->
  <section id="game" class="screen hidden">
    <div class="topbar">
      <button class="icon-btn" id="homeBtn" title="Domov">🏠</button>
      <div class="progress"><div id="progressBar"></div></div>
      <div class="stars" id="starsLabel">⭐ 0</div>
      <button class="icon-btn" id="soundBtn" title="Zvuk">🔊</button>
    </div>

    <div class="card problem-card">
      <div class="counter" id="counter">Úloha 1 z 10</div>
      <div class="prompt hidden" id="prompt"></div>
      <div class="pic hidden" id="pic"></div>
      <div class="formula hidden" id="formula"></div>
      <div class="problem" id="problem">
        <span class="answer empty" id="answer"></span>
      </div>
      <div class="feedback" id="feedback"></div>
      <button class="hint-btn" id="hintBtn">💡 Pomôcka</button>
      <div class="hint hidden" id="hint">
        <div class="hint-text" id="hintText"></div>
        <div id="hintBody"></div>
      </div>
    </div>

    <div class="keypad" id="keypad">
      <button class="key num" data-k="1">1</button>
      <button class="key num" data-k="2">2</button>
      <button class="key num" data-k="3">3</button>
      <button class="key num" data-k="4">4</button>
      <button class="key num" data-k="5">5</button>
      <button class="key num" data-k="6">6</button>
      <button class="key num" data-k="7">7</button>
      <button class="key num" data-k="8">8</button>
      <button class="key num" data-k="9">9</button>
      <button class="key sym" data-k="<">&lt;</button>
      <button class="key sym" data-k="=">=</button>
      <button class="key sym" data-k=">">&gt;</button>
      <button class="key del" data-k="del">⌫</button>
      <button class="key num" data-k="0">0</button>
      <button class="key go" data-k="go" id="goKey">✓</button>
    </div>
  </section>

  <!-- KONIEC -->
  <section id="end" class="screen hidden">
    <h1 id="endTitle">Hotovo!</h1>
    <div class="card">
      <div class="end-stars" id="endStars"></div>
      <div class="end-score" id="endScore"></div>
    </div>
    <div class="card hidden" id="mistakesCard">
      <h2>Tieto si ešte zopakuj:</h2>
      <div class="mistakes" id="mistakes"></div>
    </div>
    <div class="card hidden" id="hintedCard">
      <h2>💡 S pomôckou:</h2>
      <div class="mistakes" id="hintedList"></div>
    </div>
    <button class="big-btn" id="againBtn">Hrať znova ▶</button>
    <button class="big-btn secondary" id="endHomeBtn">◀ Späť</button>
  </section>

</main>

<div class="modal-backdrop hidden" id="resetModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
    <div class="modal-icon">🗑️</div>
    <h2 id="resetTitle">Naozaj vymazať pamäť?</h2>
    <p>Všetky príklady sa vrátia na začiatok. Toto sa nedá vrátiť späť.</p>
    <div class="modal-actions">
      <button class="big-btn secondary" id="resetNo">Nie, nechať tak</button>
      <button class="big-btn danger" id="resetYes">Áno, vymazať</button>
    </div>
  </div>
</div>

<script>
// ===== Nastavenia =====
// Keď príde na rad ďalšie číslo násobilky, stačí ho pridať sem, napr. [2, 3].
const TABLES = [2];
const SESSION_LEN = 10;
const STORE_KEY = 'matematika.stats.v1';

const PRAISE = ['Výborne!', 'Super!', 'Paráda!', 'Správne!', 'Si jednotka!', 'Bravó!', 'Presne tak!'];

// ===== Pomocné =====
const $ = id => document.getElementById(id);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function show(screen) {
  ['menu', 'home', 'game', 'end'].forEach(s => $(s).classList.toggle('hidden', s !== screen));
}
function plural(n, one, few, many) {
  if (n === 1) return one;
  if (n >= 2 && n <= 4) return few;
  return many;
}
function restartAnim(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

// Značka miesta pre políčko s odpoveďou v zadaní úlohy
const ANS = {};
// Desiatky a jednotky farebne ako tyčinky a kocky na obrázku
const D = '<b class="d">D</b>', J = '<b class="j">J</b>';

// ===== Témy =====
// Každá téma má:
//   modes  – kroky v poradí, v akom sa učia (posledný je „Všetko“ s id 'mix')
//   facts  – príklady { key, kind, ans, label, solved, … }; kind = id kroku
//   view(f) – ako vyzerá zadanie: { prompt?, pic?, parts: [html | ANS], size? }
//   hint(f) – pomôcka: { text, node }
// Pokrok sa ukladá podľa f.key, preto musia byť kľúče jedinečné naprieč témami.

// count skupín po size guličkách (prázdna skupina = prázdny tanier)
function dotGroups(count, size) {
  const groups = el('div', 'groups');
  for (let g = 0; g < count; g++) {
    const grp = el('div', 'group');
    for (let d = 0; d < size; d++) grp.appendChild(el('div', 'dot'));
    groups.appendChild(grp);
  }
  return groups;
}
// Teória: pole riadkov [trieda, html] alebo hotových prvkov
function theory(rows) {
  const box = el('div');
  rows.forEach(r => {
    if (r instanceof Node) { box.appendChild(r); return; }
    const p = el(r[0] === 'formula' || r[0] === 'pair' || r[0] === 'names' ? 'div' : 'p', r[0]);
    p.innerHTML = r[1];
    box.appendChild(p);
  });
  return box;
}

// --- Násobilka a delilka ---
// Pre číslo k vytvorí: k·n, n·k, (k·n):k a (k·n):n pre n = 1..10
function buildMulFacts(k) {
  const facts = [];
  const add = (a, op, b, ans, kind) => {
    const key = `${a}${op}${b}`;
    if (facts.some(f => f.key === key)) return;
    const label = `${a} ${op} ${b}`;
    facts.push({ key, a, op, b, ans, kind, label, solved: `${label} = ${ans}` });
  };
  for (let n = 1; n <= 10; n++) {
    const p = k * n;
    add(k, '·', n, p, 'mul');
    add(n, '·', k, p, 'mul');
    add(p, ':', k, n, 'div');
    add(p, ':', n, k, 'div');
  }
  return facts;
}

// --- Desiatky a jednotky (učebnica, Zopakuj si, úloha 3) ---
// Postup: 1. obrázok → číslo, 2. číslo → koľko desiatok / jednotiek, 3. zápis D a J → číslo
// (aj s výmenou 10 jednotiek za desiatku a s jednotkami napísanými ako prvé).
const DJ_PIC = [13, 20, 26, 31, 38, 40, 45, 50, 57, 62, 64, 70, 79, 83, 86, 91, 19, 98];
const DJ_SPLIT = [38, 7, 40, 19, 91, 36, 63, 55, 80, 12, 74, 99];
const DJ_BUILD = [[3, 8], [4, 7], [6, 0], [1, 9], [9, 1], [5, 5], [7, 2], [2, 6]];
const DJ_SWAP = [[2, 15], [1, 12], [3, 10], [4, 13], [5, 11], [6, 14]];  // viac ako 9 jednotiek
const DJ_REV = [[3, 8], [5, 2], [9, 1]];                                 // najprv jednotky, potom desiatky

function buildDJFacts() {
  const facts = [];
  DJ_PIC.forEach(n => {
    const d = Math.floor(n / 10), j = n % 10;
    facts.push({ key: `dj:obr:${n}`, kind: 'obr', d, j, ans: n, label: `🧱 ${n}`, solved: `${d} D ${j} J = ${n}` });
  });
  DJ_SPLIT.forEach(n => {
    const d = Math.floor(n / 10), j = n % 10;
    const solved = `${n} = ${d} D ${j} J`;
    facts.push({ key: `dj:d:${n}`, kind: 'roz', part: 'd', n, d, j, ans: d, label: `${n} → D`, solved });
    facts.push({ key: `dj:j:${n}`, kind: 'roz', part: 'j', n, d, j, ans: j, label: `${n} → J`, solved });
  });
  [...DJ_BUILD, ...DJ_SWAP].forEach(([d, j]) => {
    const ans = d * 10 + j;
    facts.push({ key: `dj:zap:${d},${j}`, kind: 'zap', d, j, ans, label: `${d}D ${j}J`, solved: `${d} D ${j} J = ${ans}` });
  });
  DJ_REV.forEach(([d, j]) => {
    const ans = d * 10 + j;
    facts.push({ key: `dj:zapr:${d},${j}`, kind: 'zap', rev: true, d, j, ans, label: `${j}J ${d}D`, solved: `${j} J ${d} D = ${ans}` });
  });
  return facts;
}

// Obrázok: d tyčiniek po 10 a j kociek. Ak je kociek viac ako 9, prvých 10 je v rámčeku „10 J = 1 D“.
// labels: nad tyčinkami sa počíta po desiatkach (10, 20, 30 …).
function blocks(d, j, labels = false) {
  const wrap = el('div', 'blocks');
  if (d) {
    const rods = el('div', 'rods');
    for (let i = 0; i < d; i++) {
      const rw = el('div', 'rod-wrap');
      if (labels) rw.appendChild(el('div', 'rod-lbl', (i + 1) * 10));
      rw.appendChild(el('div', 'rod'));
      rods.appendChild(rw);
    }
    wrap.appendChild(rods);
  }
  if (j) {
    const cw = el('div', 'cubes-wrap');
    const cubes = n => {
      const g = el('div', 'cubes');
      for (let i = 0; i < n; i++) g.appendChild(el('div', 'cube'));
      return g;
    };
    let rest = j;
    if (j >= 10) {
      const fr = el('div', 'ten-frame');
      fr.appendChild(el('div', 'ten-cap', '10 J = 1 D'));
      fr.appendChild(cubes(10));
      cw.appendChild(fr);
      rest -= 10;
    }
    if (rest) cw.appendChild(cubes(rest));
    wrap.appendChild(cw);
  }
  return wrap;
}

// --- Úvod do násobenia (učebnica s. 8–11) ---
// Postup: 1. skupiny na obrázku → sčítanie → násobenie, 2. sčítanie rovnakých čísel zapísať násobením,
// 3. výmena činiteľov a porovnávanie súčinov, 4. násobenie 0, 1 a 10.
// sum(3, 7) = "7 + 7 + 7"; dlhé súčty sa skrátia
function sum(c, v, short = false) {
  if (c > (short ? 3 : 7)) return `${v} + ${v} + … + ${v} (${c}-krát)`;
  return Array(c).fill(v).join(' + ');
}
const UV_GROUPS = [[2, 2], [3, 2], [4, 2], [5, 2], [2, 3], [3, 3], [4, 3], [5, 3],
                   [2, 4], [3, 4], [4, 4], [5, 4], [2, 5], [3, 5], [4, 5], [5, 5]];
const UV_SUM = [[3, 7], [7, 2], [2, 6], [4, 3], [3, 9], [5, 4]];          // [koľkokrát, číslo]
const UV_SWAP = [[3, 2], [5, 4], [9, 1], [2, 6], [4, 3], [10, 5], [7, 8], [6, 9]];
const UV_CMP = [[[1, 9], [9, 1]], [[8, 2], [2, 8]], [[2, 6], [4, 3]], [[5, 4], [4, 2]],
                [[3, 3], [3, 5]], [[2, 9], [3, 4]], [[3, 5], [5, 3]], [[10, 5], [5, 10]],
                [[2, 3], [2, 5]], [[4, 3], [4, 2]], [[2, 7], [7, 2]], [[2, 4], [3, 3]]];
const UV_ZERO_ONE_TEN = [[6, 1], [3, 1], [9, 1], [1, 7], [1, 4],
                         [4, 0], [8, 0], [2, 0], [0, 6], [0, 9],
                         [2, 10], [5, 10], [8, 10], [3, 10], [10, 4], [10, 7]];

function buildUvodFacts() {
  const facts = [];
  UV_GROUPS.forEach(([a, b]) => facts.push({
    key: `un:sk:${a}x${b}`, kind: 'sk', a, b, ans: a * b,
    label: `${a} po ${b}`, solved: `${a} · ${b} = ${sum(a, b)} = ${a * b}`,
  }));
  UV_SUM.forEach(([c, v]) => {
    const solved = `${sum(c, v)} = ${c} · ${v}`;
    facts.push({ key: `un:sn:c:${c},${v}`, kind: 'sn', blank: 'c', c, v, ans: c, label: `${sum(c, v, true)} = ? · ${v}`, solved });
    facts.push({ key: `un:sn:v:${c},${v}`, kind: 'sn', blank: 'v', c, v, ans: v, label: `${sum(c, v, true)} = ${c} · ?`, solved });
  });
  UV_SWAP.forEach(([a, b], i) => facts.push({
    key: `un:vy:${a},${b}`, kind: 'vy', a, b, left: i % 2 === 0, ans: i % 2 === 0 ? b : a,
    label: i % 2 === 0 ? `${a}·${b} = ?·${a}` : `${a}·${b} = ${b}·?`, solved: `${a} · ${b} = ${b} · ${a}`,
  }));
  UV_CMP.forEach(([l, r]) => {
    const pl = l[0] * l[1], pr = r[0] * r[1];
    const ans = pl < pr ? '<' : pl > pr ? '>' : '=';
    const L = `${l[0]} · ${l[1]}`, R = `${r[0]} · ${r[1]}`;
    facts.push({ key: `un:po:${l.join('·')}|${r.join('·')}`, kind: 'vy', input: 'cmp', l, r, ans,
      label: `${L} ? ${R}`, solved: `${L} ${ans} ${R}` });
  });
  UV_ZERO_ONE_TEN.forEach(([a, b]) => facts.push({
    key: `un:k:${a}·${b}`, kind: 'k', a, b, ans: a * b, label: `${a} · ${b}`, solved: `${a} · ${b} = ${a * b}`,
  }));
  return facts;
}

const UD_CTX = [
  { item: n => plural(n, 'cukrík', 'cukríky', 'cukríkov'), itemGen: 'cukríkov', cont: 'tanierikov',
    inEach: 'na každom tanieriku', putEach: 'Na každý tanierik' },
  { item: n => plural(n, 'ceruzku', 'ceruzky', 'ceruziek'), itemGen: 'ceruziek', cont: 'peračníkov',
    inEach: 'v každom peračníku', putEach: 'Do každého peračníka' },
  { item: n => plural(n, 'jablko', 'jablká', 'jabĺk'), itemGen: 'jabĺk', cont: 'košíkov',
    inEach: 'v každom košíku', putEach: 'Do každého košíka' },
];
const UD_SHARE = [[8, 2], [12, 3], [10, 5], [6, 2], [15, 3], [12, 4], [20, 5], [9, 3], [16, 4], [10, 2], [14, 2], [18, 3]]; // [spolu, do koľkých]
const UD_MEASURE = [[12, 4], [10, 5], [8, 2], [15, 5], [12, 3], [18, 6], [14, 7], [20, 5], [16, 4], [9, 3], [12, 2], [28, 7]]; // [spolu, po koľko]
const UD_FAMILY = [[4, 2], [3, 2], [5, 2], [7, 2], [3, 4], [2, 6], [5, 3], [4, 5]];       // a · b = p → p : b, p : a
const UD_ZERO_ONE_TEN = [[5, 1], [8, 1], [4, 1], [2, 1], [6, 1], [0, 8], [0, 1], [0, 10], [0, 5],
                         [90, 10], [10, 10], [50, 10], [70, 10], [100, 10], [30, 10], [40, 10]];

function buildUvDelFacts() {
  const facts = [];
  UD_SHARE.forEach(([n, k], i) => facts.push({
    key: `ud:rz:${n}:${k}`, kind: 'rz', n, k, ctx: UD_CTX[i % UD_CTX.length], ans: n / k,
    label: `${n} do ${k}`, solved: `${n} : ${k} = ${n / k}`,
  }));
  UD_MEASURE.forEach(([n, b], i) => facts.push({
    key: `ud:po:${n}:${b}`, kind: 'po', n, b, ctx: UD_CTX[i % UD_CTX.length], ans: n / b,
    label: `${n} po ${b}`, solved: `${n} : ${b} = ${n / b}`,
  }));
  UD_FAMILY.forEach(([a, b]) => {
    const p = a * b;
    [[b, a], [a, b]].forEach(([d, ans]) => facts.push({
      key: `ud:sv:${p}:${d}`, kind: 'sv', a, b, p, d, ans,
      label: `${p} : ${d}`, solved: `${a} · ${b} = ${p}, ${p} : ${d} = ${ans}`,
    }));
  });
  UD_ZERO_ONE_TEN.forEach(([a, b]) => facts.push({
    key: `ud:k:${a}:${b}`, kind: 'k', a, b, ans: a / b, label: `${a} : ${b}`, solved: `${a} : ${b} = ${a / b}`,
  }));
  return facts;
}

// n voľných guličiek (ešte nerozdelených) v mriežke po cols
function looseDots(n, cols = 10) {
  const box = el('div', 'loose');
  box.style.gridTemplateColumns = `repeat(${Math.min(n, cols)}, auto)`;
  for (let i = 0; i < n; i++) box.appendChild(el('div', 'dot'));
  return box;
}
// n guličiek → k prázdnych tanierov
function shareSetup(n, k) {
  const pair = el('div', 'pair');
  pair.appendChild(looseDots(n, 5));
  pair.appendChild(el('span', '', '→'));
  pair.appendChild(dotGroups(k, 0));
  return pair;
}

      text: `Rozdávaj do ${f.k} skupín po jednej, kým sa neminú. Koľko je v jednej skupine?`,

    const n = a / 10;
    return { text: `${a} korálikov navliekame po 10 na šnúrky. Koľko šnúrok treba?`, node: blocks(n, 0, true) };
  },
};

// ===== Uložený pokrok =====
let stats = {};
try { stats = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { stats = {}; }
function saveStats() { try { localStorage.setItem(STORE_KEY, JSON.stringify(stats)); } catch (e) {} }
function statOf(key) { return stats[key] || { seen: 0, streak: 0, weak: false, hints: 0, lastHint: false }; }
// result: 'ok' = správne na prvý pokus bez pomôcky, 'hint' = správne s pomôckou, 'bad' = chyba
function record(key, result) {
  const s = statOf(key);
  s.seen++;
  s.hints = (s.hints || 0) + (result === 'hint' ? 1 : 0);
  s.lastHint = result === 'hint';
  if (result === 'ok') { s.streak++; s.weak = false; }
  else if (result === 'hint') { s.streak = 0; s.weak = false; }
  else { s.streak = 0; s.weak = true; }
  stats[key] = s;
  saveStats();
}
function levelOf(key) {
  const s = statOf(key);
  if (s.seen === 0) return 'new';
  if (s.weak) return 'weak';
  if (s.streak >= 3) return 'mastered';
  return 'learning';
}

// ===== Výber úloh =====
const MIN_REVIEW = 2; // koľko zvládnutých príkladov sa v kole vždy zopakuje (ak nejaké sú)

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function poolFor(t, m) {
  return t.facts.filter(f => m === 'mix' || f.kind === m);
}
function allMastered(t, m) { return poolFor(t, m).every(f => levelOf(f.key) === 'mastered'); }
// Nezvládnuté príklady majú v kole isté miesto (červené, potom žlté, potom sivé),
// zvyšok doplnia zvládnuté na zopakovanie. Nakoniec sa poradie zamieša.
function pickSession(t, m) {
  const pool = poolFor(t, m);
  const byLevel = lvl => shuffle(pool.filter(f => levelOf(f.key) === lvl));
  const mastered = byLevel('mastered');
  const todo = [...byLevel('weak'), ...byLevel('learning'), ...byLevel('new')];
  const size = Math.min(SESSION_LEN, pool.length);
  const todoSlots = Math.min(todo.length, size - Math.min(MIN_REVIEW, mastered.length));
  const chosen = todo.slice(0, todoSlots);
  chosen.push(...mastered.slice(0, size - chosen.length));
  return shuffle(chosen);
}

// ===== Zvuk =====
let soundOn = true;
let audioCtx = null;
function beep(freqs, dur = 0.12, vol = 0.18) {
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      const t = audioCtx.currentTime + i * dur;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur * 1.6);
      o.connect(g).connect(audioCtx.destination);
      o.start(t); o.stop(t + dur * 1.7);
    });
  } catch (e) {}
}
const sndOk = () => beep([660, 880]);
const sndBad = () => beep([300, 220], 0.15);
const sndKey = d => beep([700 + Number(d) * 40], 0.04, 0.08);
const sndDel = () => beep([420], 0.04, 0.08);
const sndMode = () => beep([600, 800], 0.06, 0.12);
const sndStart = () => beep([523, 659, 784], 0.09, 0.15);
const sndWin =() => beep([523, 659, 784, 1047], 0.13);

// ===== Obrazovka témy =====
// Pri témach s postupom sa ponúkne prvý krok, ktorý ešte nie je celý zvládnutý.
function defaultMode(t) {
  if (!t.progressive) return t.defaultMode;
  const next = t.modes.find(m => m.id !== 'mix' && !allMastered(t, m.id));
  return next ? next.id : 'mix';
}
function currentMode() { return modeOf[topic.id]; }

function renderTheory() {
  const md = topic.modes.find(x => x.id === currentMode());
  const box = $('theory');
  box.innerHTML = '';
  if (md && md.theory) box.appendChild(md.theory());
  $('theoryCard').classList.toggle('hidden', !(md && md.theory));
}

function renderHome() {
  const m = modeOf[topic.id];
  if (!m || (topic.progressive && m !== 'mix' && allMastered(topic, m))) modeOf[topic.id] = defaultMode(topic);
  $('topicTitle').textContent = topic.title;
  $('topicSub').textContent = topic.desc;

  const modes = $('modes');
  modes.innerHTML = '';
  topic.modes.forEach(md => {
    const btn = el('button', 'mode');
    btn.classList.toggle('active', md.id === currentMode());
    btn.classList.toggle('done', md.id !== 'mix' && allMastered(topic, md.id));
    btn.appendChild(el('span', 'sym', md.sym));
    btn.appendChild(document.createTextNode(md.name));
    btn.addEventListener('click', () => {
      modeOf[topic.id] = md.id;
      sndMode();
      modes.querySelectorAll('.mode').forEach(b => b.classList.toggle('active', b === btn));
      renderTheory();
    });
    modes.appendChild(btn);
  });

  renderTheory();

  const groups = $('factGroups');
  groups.innerHTML = '';
  topic.modes.filter(md => md.id !== 'mix').forEach(md => {
    groups.appendChild(el('div', 'grid-label', md.name));
    const box = el('div', 'facts');
    poolFor(topic, md.id).forEach(f => {
      const s = statOf(f.key);
      const d = el('span', 'fact ' + levelOf(f.key), f.label + (s.lastHint ? ' 💡' : ''));
      if (s.hints) d.title = `Pomôcka použitá ${s.hints}×`;
      box.appendChild(d);
    });
    groups.appendChild(box);
  });
  show('home');
}

// ===== Hra =====
let queue = [], idx = 0, current = null, input = '', attempt = 0, state = 'input', hintUsed = false;
let starCount = 0, total = 0, mistakes = [], hinted = [], results = [], requeued = new Set();
const answerEl = $('answer');

function startGame() {
  sndStart();
  queue = pickSession(topic, currentMode());
  total = queue.length;
  idx = 0; starCount = 0; mistakes = []; hinted = []; results = []; requeued = new Set();
  show('game');
  nextQuestion();
}

function renderProblem(f) {
  const v = topic.view(f);
  $('prompt').textContent = v.prompt || '';
  $('prompt').classList.toggle('hidden', !v.prompt);
  $('formula').innerHTML = v.formula || '';
  $('formula').classList.toggle('hidden', !v.formula);
  const pic = $('pic');
  pic.innerHTML = '';
  if (v.pic) pic.appendChild(v.pic);
  pic.classList.toggle('hidden', !v.pic);
  const prob = $('problem');
  prob.className = 'problem' + (v.size ? ' ' + v.size : '');
  prob.innerHTML = '';
  v.parts.forEach(p => {
    if (p === ANS) { prob.appendChild(answerEl); return; }
    const s = el('span');
    s.innerHTML = p;
    prob.appendChild(s);
  });
}

function nextQuestion() {
  if (idx >= queue.length) return endGame();
  current = queue[idx];
  input = ''; attempt = 0; state = 'input'; hintUsed = false;
  renderProblem(current);
  $('keypad').classList.toggle('cmp', current.input === 'cmp');
  $('feedback').textContent = ''; $('feedback').className = 'feedback';
  $('hint').classList.add('hidden');
  $('hintBtn').classList.remove('hidden');
  $('goKey').textContent = '✓'; $('goKey').classList.remove('next');
  $('counter').textContent = `Úloha ${Math.min(idx + 1, total)} z ${total}` + (idx >= total ? ' (opakovanie)' : '');
  $('progressBar').style.width = (Math.min(idx, total) / total * 100) + '%';
  $('starsLabel').textContent = '⭐ ' + starCount;
  renderAnswer();
}

function renderAnswer(cls = '') {
  answerEl.textContent = input;
  answerEl.className = 'answer' + (input === '' ? ' empty' : '') + (cls ? ' ' + cls : '');
}

function press(k) {
  if (state === 'wait') return;
  if (state === 'reveal') { if (k === 'go') { idx++; nextQuestion(); } return; }
  if (k === 'del') { if (input) sndDel(); input = input.slice(0, -1); renderAnswer(); return; }
  if (k === 'go') { submit(); return; }
  const cmp = current.input === 'cmp';
  if (cmp !== '<=>'.includes(k)) return; // pri porovnávaní len znaky, inak len číslice
  if (cmp) { sndKey(5); input = k; renderAnswer(); return; }
  if (input.length >= 3) return;
  sndKey(k);
  if (input === '0') input = '';
  input += k;
  renderAnswer();
}

function submit() {
  if (input === '') { restartAnim(answerEl, 'shake'); return; }
  const ok = current.input === 'cmp' ? input === current.ans : parseInt(input, 10) === current.ans;
  const fb = $('feedback');

  if (ok) {
    const firstTry = attempt === 0;
    const result = !firstTry ? 'bad' : hintUsed ? 'hint' : 'ok';
    if (idx < total) {
      if (result === 'ok') starCount++;
      if (result === 'hint') hinted.push(current);
      results.push(result);
      record(current.key, result);
    }
    renderAnswer('ok'); restartAnim(answerEl, 'pop');
    fb.textContent = PRAISE[Math.floor(Math.random() * PRAISE.length)] +
      (result === 'ok' ? ' ⭐' : result === 'hint' ? ' (s pomôckou 💡)' : '');
    fb.className = 'feedback ok';
    $('starsLabel').textContent = '⭐ ' + starCount;
    sndOk();
    state = 'wait';
    setTimeout(() => { idx++; nextQuestion(); }, 1100);
    return;
  }

  attempt++;
  sndBad();
  if (attempt === 1) {
    renderAnswer('bad'); restartAnim(answerEl, 'shake');
    fb.textContent = 'Skoro! Skús to ešte raz.';
    fb.className = 'feedback bad';
    showHint();
    state = 'wait';
    setTimeout(() => { input = ''; renderAnswer(); state = 'input'; }, 900);
  } else {
    // druhý pokus zlý – ukážeme správny výsledok a príklad príde ešte raz na konci
    if (idx < total) { record(current.key, 'bad'); results.push('bad'); }
    if (!mistakes.includes(current)) mistakes.push(current);
    if (!requeued.has(current.key)) { requeued.add(current.key); queue.push(current); }
    input = String(current.ans);
    renderAnswer('reveal'); restartAnim(answerEl, 'pop');
    fb.textContent = current.input === 'cmp' ? `Správne je ${current.solved}.` : `Správne je ${current.ans}. Zapamätaj si to!`;
    fb.className = 'feedback reveal';
    showHint();
    $('goKey').textContent = 'Ďalej'; $('goKey').classList.add('next');
    state = 'reveal';
  }
}

function showHint() {
  const h = topic.hint(current);
  $('hintText').textContent = h.text;
  const body = $('hintBody');
  body.innerHTML = '';
  if (h.node) body.appendChild(h.node);
  $('hint').classList.remove('hidden');
  $('hintBtn').classList.add('hidden');
}

function endGame() {
  $('progressBar').style.width = '100%';
  sndWin();
  const m = currentMode();
  const ratio = starCount / total;
  let trophy = topic.trophy && topic.trophy(m);
  if (!trophy) trophy = m === 'mix' ? `${topic.title} už vieš!` : `${topic.modes.find(md => md.id === m).name}: všetko vieš!`;
  $('endTitle').textContent = allMastered(topic, m)
    ? `🏆 ${trophy}`
    : ratio === 1 ? 'Úžasné! Všetko správne!' : ratio >= 0.7 ? 'Výborne!' : 'Dobrá práca!';
  $('endStars').textContent = results.map(r => ({ ok: '⭐', hint: '💡', bad: '☆' })[r]).join('');
  $('endScore').textContent = `${starCount} z ${total} hviezdičiek` +
    (hinted.length ? `, ${hinted.length}× s pomôckou` : '');
  const fill = (card, list, items) => {
    list.innerHTML = '';
    items.forEach(f => list.appendChild(el('span', 'mistake', f.solved)));
    card.classList.toggle('hidden', items.length === 0);
  };
  fill($('hintedCard'), $('hintedList'), hinted);
  fill($('mistakesCard'), $('mistakes'), mistakes);
  show('end');
}

document.addEventListener('keydown', e => {
  if (!$('resetModal').classList.contains('hidden')) {
    if (e.key === 'Escape') closeResetModal();
    return;
  }
  if ($('game').classList.contains('hidden')) {
    if (e.key === 'Enter' && !$('end').classList.contains('hidden')) startGame();
    return;
  }
  let k = null;
  if (/^[0-9<>=]$/.test(e.key)) k = e.key;
  else if (e.key === 'Backspace' || e.key === 'Delete') k = 'del';
  else if (e.key === 'Enter' || e.key === ' ') k = 'go';
  if (k === null) return;
  e.preventDefault();
  const btn = document.querySelector(`.key[data-k="${k}"]`);
  if (btn) { btn.classList.add('pressed'); setTimeout(() => btn.classList.remove('pressed'), 100); }
  press(k);
});

renderMenu();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
